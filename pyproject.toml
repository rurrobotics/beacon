[project]
name = "beacon"
version = "0.1.0"
description = "ArUco-based SIMA tracking with UDP position broadcast."
authors = [
    {name = "doedarnma", email = "tamara.taca.radmilovic@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "flask (>=3.1.3,<4.0.0)",
    "numpy (>=2.5.5,<3.0.0)",
    "opencv-python (>=5.1.0.95,<6.0.0.0)"
]

[project.scripts]
beacon = "beacon.__main__:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
